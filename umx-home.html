const storage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const saved=storage.get('umx.language');const preferred=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'])[0]||'en';let lang=['zh','en'].includes(saved)?saved:(/^zh\b/i.test(preferred)?'zh':'en');
let index=0,timer,toastTimer,lastFocus;const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);const modal=$('.welcome');
function setLanguage(value,persist=false){lang=value;const t=translations[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=lang==='zh'?'UMX 加密友好型证券平台｜币股互通，一手掌控':'UMX — Crypto-Friendly Securities Platform';$$('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);$('.letter').replaceChildren(...t.letter.map(text=>{const p=document.createElement('p');p.textContent=text;return p}));$('.current-lang').textContent=lang==='zh'?'简体中文':'English';$$('[data-lang]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.lang===lang)));$('.cards').innerHTML=[t.cards[3],...t.cards,...t.cards.slice(0,2)].map((c,i)=>`<button class="card" data-card="${(i+3)%4}"><span class="card-text"><h3>${c[0]}</h3><p>${c[1]}</p><span class="more">${t.more}</span></span><img src="${cardImages[(i+3)%4]}" alt=""></button>`).join('');$('.mode').setAttribute('aria-label',lang==='zh'?'切换加密与股票':'Switch between crypto and stocks');modal.setAttribute('aria-label',lang==='zh'?'欢迎来到 UMX':'Welcome to UMX');$('.dots').innerHTML=t.cards.map((_,i)=>`<button class="dot" data-slide="${i}" aria-label="${lang==='zh'?'第':'Slide '}${i+1}${lang==='zh'?'张':''}"></button>`).join('');updateCarousel();if(persist)storage.set('umx.language',lang);}
function updateCarousel(){const target=$('.cards').children[index+1];if(!target)return;const clip=$('.carousel-clip');const centered=innerWidth<1280;const rect=target.getBoundingClientRect();const track=$('.cards');const offset=centered?(clip.clientWidth-rect.width)/2:0;const left=rect.left-track.getBoundingClientRect().left;track.style.transform=`translateX(${offset-left}px)`;$$('.dot').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-current',i===index?'true':'false')});}
function advance(n=1){index=(index+n+4)%4;updateCarousel()}
function play(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>{if(modal.hidden&&!document.hidden)advance()},6000)}
function showWelcome(){lastFocus=document.activeElement;modal.hidden=false;document.body.classList.add('welcome-open');$('main').inert=true;$('nav').inert=true;$('footer').inert=true;$('.chat').inert=true;$('#dont-show').checked=storage.get('umx.hideWelcome')==='true';setTimeout(()=>modal.focus({preventScroll:true}),0)}
function closeWelcome(){storage.set('umx.hideWelcome',String($('#dont-show').checked));modal.hidden=true;document.body.classList.remove('welcome-open');$('main').inert=false;$('nav').inert=false;$('footer').inert=false;$('.chat').inert=false;(lastFocus||$('.hero-cta')).focus({preventScroll:true});play()}
function toast(message){$('.toast').textContent=message;$('.toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('.toast').hidden=true,4500)}
function closeMenus(){ $$('.langmenu').forEach(e=>e.hidden=true);$$('.lang-trigger').forEach(e=>e.setAttribute('aria-expanded','false')) }
$$('.lang-trigger').forEach(b=>b.onclick=e=>{e.stopPropagation();const menu=b.nextElementSibling;const open=menu.hidden;closeMenus();menu.hidden=!open;b.setAttribute('aria-expanded',String(open))});$$('[data-lang]').forEach(b=>b.onclick=()=>{setLanguage(b.dataset.lang,true);closeMenus()});document.addEventListener('click',closeMenus);
$('.enter').onclick=closeWelcome;$('#dont-show').onchange=e=>storage.set('umx.hideWelcome',String(e.target.checked));$('#show-welcome').onclick=showWelcome;
$('.mode').onclick=()=>{const checked=$('.mode').getAttribute('aria-checked')!=='true';$('.mode').setAttribute('aria-checked',String(checked));$('.hero').classList.toggle('stock',checked);$('.crypto-label').classList.toggle('selected',!checked);$('.stock-label').classList.toggle('selected',checked)};
$('.next').onclick=()=>{advance();play()};$('.prev').onclick=()=>{advance(-1);play()};$('.dots').onclick=e=>{const b=e.target.closest('[data-slide]');if(b){index=Number(b.dataset.slide);updateCarousel();play()}};$('.cards').onclick=e=>{const b=e.target.closest('[data-card]');if(b)toast(translations[lang].cards[Number(b.dataset.card)][1])};$('.promos').onmouseenter=()=>clearInterval(timer);$('.promos').onmouseleave=play;$('.promos').addEventListener('focusin',()=>clearInterval(timer));$('.promos').addEventListener('focusout',play);
let touchX=0;$('.cards').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});$('.cards').addEventListener('touchend',e=>{const d=touchX-e.changedTouches[0].clientX;if(Math.abs(d)>40){advance(d>0?1:-1);play()}},{passive:true});
$$('.action').forEach(b=>b.onclick=()=>toast(translations[lang].demo));$('.chat').onclick=()=>toast(translations[lang].support);$('.menu-mobile').onclick=()=>{const open=$('nav').classList.toggle('mobile-open');$('.menu-mobile').setAttribute('aria-expanded',String(open))};$$('.navlinks a').forEach(a=>a.onclick=()=>{$('nav').classList.remove('mobile-open');$('.menu-mobile').setAttribute('aria-expanded','false')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();return}if(!modal.hidden&&e.key==='Tab'){const focusable=[...modal.querySelectorAll('button,input')].filter(el=>el.getClientRects().length);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',updateCarousel);setLanguage(lang);if(storage.get('umx.hideWelcome')!=='true')showWelcome();play();
</script></body></html>
